name: Moodle Plugin CI
run-name: >
  ${{ github.event_name == 'workflow_dispatch' && 'CI - Manual Run' ||
      github.event_name == 'pull_request' && format('CI - Pull Request #{0}', github.event.pull_request.number) ||
      github.event_name == 'push' && format('CI - Tag {0}', github.ref_name) ||
      'CI' }}

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      moodle_branch:
        description: "Select one Moodle branch to test, or ALL for the full matrix"
        required: true
        type: choice
        options:
          - ALL
          - MOODLE_405_STABLE
          - MOODLE_501_STABLE
          - MOODLE_502_STABLE
          - MOODLE_503_STABLE

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}

    steps:
      - id: generate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ inputs.moodle_branch }}" != "ALL" ]]; then
            matrix='[{"moodle-branch":"${{ inputs.moodle_branch }}","php":"8.3","database":"mariadb","config-root":"${{ inputs.moodle_branch == 'MOODLE_405_STABLE' && '/' || '/public' }}","phpunit-config":"${{ inputs.moodle_branch == 'MOODLE_405_STABLE' && 'phpunit-9.xml' || 'phpunit-11.xml' }}"}]'
          else
            matrix='[
              {"moodle-branch":"MOODLE_405_STABLE","php":"8.3","database":"mariadb","config-root":"/","phpunit-config":"phpunit-9.xml"},
              {"moodle-branch":"MOODLE_501_STABLE","php":"8.3","database":"mariadb","config-root":"/public","phpunit-config":"phpunit-11.xml"},
              {"moodle-branch":"MOODLE_502_STABLE","php":"8.3","database":"mariadb","config-root":"/public","phpunit-config":"phpunit-11.xml"},
              {"moodle-branch":"MOODLE_503_STABLE","php":"8.3","database":"mariadb","config-root":"/public","phpunit-config":"phpunit-11.xml"}
            ]'
          fi

          {
            printf 'matrix<<EOF\n'
            printf '%s\n' "$matrix"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare-matrix
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_USER: "root"
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: pcov

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: Enable plugin in config.php
        if: ${{ !cancelled() }}
        run: |
          echo "Using config root: ${{ matrix.config-root }}"
          moodle-plugin-ci add-config 'require_once(__DIR__ . "${{ matrix.config-root }}/admin/tool/configascode/applypolicy.php");'
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: |
          echo "Using PHPUnit config: ${{ matrix.phpunit-config }}"
          moodle-plugin-ci phpunit --testdox --coverage-text --fail-on-warning --configuration "${{ matrix.phpunit-config }}"

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

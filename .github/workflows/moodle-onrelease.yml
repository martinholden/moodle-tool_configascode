on:
  workflow_run:
    workflows:
      - 'Moodle Plugin CI'
    types:
      - completed

name: Generate Changelog and Create Release
run-name: >
  Release ${{ github.event.workflow_run.pull_requests[0].head.ref || github.event.workflow_run.head_branch || github.event.workflow_run.head_sha }}
  (CI #${{ github.event.workflow_run.run_number }})

jobs:
  log-ci-info:
    outputs:
      tag: ${{ steps.check-tag.outputs.tag }}
      head_sha: ${{ steps.check-tag.outputs.head_sha }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Log CI information
        run: |
          echo "CI Workflow Run ID: ${{ github.event.workflow_run.id }}"
          echo "CI Workflow Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Check if this is a tag on main
        id: check-tag
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha || github.event.workflow_run.head_commit.id }}"
          echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
          if [[ -z "${HEAD_SHA}" ]]; then
            echo "tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG=$(git tag --points-at "${HEAD_SHA}" | head -n 1)

          git fetch origin main
          if git merge-base --is-ancestor "${HEAD_SHA}" origin/main; then
            ON_MAIN=true
          else
            ON_MAIN=false
          fi

          if [[ "${ON_MAIN}" == "true" ]]; then
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  generate-changelog:
    needs:
      - log-ci-info
    if: needs.log-ci-info.outputs.tag != ''
    permissions:
      contents: write
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    outputs:
      changelog_sha: ${{ steps.changelog-sha.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Keep a branch checkout here so git-auto-commit can write back to main cleanly.
          # The release tag itself still comes from the triggering CI run in log-ci-info.
          ref: main
          fetch-depth: 0  # CRITICAL: Pulls all tags so the builder can calculate differences between releases
          persist-credentials: true

      - name: "Generate Full Release Changelog"
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md
          issues: false # Disables the "Issues" section at the bottom of the file
          onlyLastTag: false # CRITICAL: Forces it to parse the entire history instead of just the latest tag
          stripGeneratorNotice: true # Removes the marketing footer at the bottom of the file
          addSections: '{"documentation":{"prefix":"### 📝 Documentation","labels":["documentation","docs"]},"enhancement":{"prefix":"### ✨ Enhancements","labels":["enhancement","feature"]}}'

      - name: Commit Changelog
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "(chore) Update CHANGELOG.md"
          file_pattern: CHANGELOG.md
          branch: main

      - name: Capture changelog commit SHA on main
        id: changelog-sha
        run: |
          git fetch origin main
          SHA=$(git rev-parse origin/main)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  retag-release:
    needs:
      - log-ci-info
      - generate-changelog
    if: needs.log-ci-info.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Move release tag to changelog commit
        env:
          TAG_NAME: ${{ needs.log-ci-info.outputs.tag }}
          TARGET_SHA: ${{ needs.generate-changelog.outputs.changelog_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git tag -f "${TAG_NAME}" "${TARGET_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

  build:
    needs:
      - log-ci-info
      - generate-changelog
      - retag-release
    if: needs.log-ci-info.outputs.tag != ''
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.log-ci-info.outputs.tag }}
          RELEASE_NAME: Release ${{ needs.log-ci-info.outputs.tag }}
          RELEASE_BODY: |
            Release for version ${{ needs.log-ci-info.outputs.tag }}, see the [CHANGELOG.md](CHANGELOG.md) for details.
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          release_json="$(curl -sS -H "${auth_header}" -H "${accept_header}" \
            "${api_url}/releases/tags/${TAG_NAME}" || true)"

          release_id="$(jq -r '.id // empty' <<<"${release_json}")"

          if [[ -n "${release_id}" ]]; then
            echo "Updating existing release ${TAG_NAME} (${release_id})"
            curl -sS -X PATCH \
              -H "${auth_header}" \
              -H "${accept_header}" \
              "${api_url}/releases/${release_id}" \
              -d "$(jq -n \
                --arg name "${RELEASE_NAME}" \
                --arg body "${RELEASE_BODY}" \
                '{name:$name, body:$body, draft:false, prerelease:false}')" \
              > /dev/null
          else
            echo "Creating new release ${TAG_NAME}"
            curl -sS -X POST \
              -H "${auth_header}" \
              -H "${accept_header}" \
              "${api_url}/releases" \
              -d "$(jq -n \
                --arg tag_name "${TAG_NAME}" \
                --arg name "${RELEASE_NAME}" \
                --arg body "${RELEASE_BODY}" \
                '{tag_name:$tag_name, name:$name, body:$body, draft:false, prerelease:false}')" \
              > /dev/null
          fi
